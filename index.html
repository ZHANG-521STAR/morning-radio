<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早安电台生成器</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e8b86d;
    --text: #eaeaea;
    --sub: #a0a0b0;
    --border: #2a2a4a;
    --danger: #ff6b6b;
    --green: #51cf66;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width:900px; width:100%; }
  header {
    text-align: center;
    padding: 30px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header h1 { font-size: 2.2em; color: var(--accent); letter-spacing: 2px; }
  header p { color: var(--sub); margin-top: 6px; font-size: 0.95em; }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
    background: var(--card);
    padding: 18px 22px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .controls label { font-weight: 600; color: var(--sub); font-size: 0.9em; white-space: nowrap; }
  .controls input[type="date"] {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 1em;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .controls input[type="date"]:focus { border-color: var(--accent); }
  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #1a1a2e; }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .btn-outline:hover { background: var(--accent); color: #1a1a2e; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .status {
    text-align: center;
    padding: 40px;
    color: var(--sub);
  }
  .status .spinner {
    display: inline-block;
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .script-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 36px;
    line-height: 1.9;
    font-size: 1.05em;
    white-space: pre-wrap;
    position: relative;
  }
  .script-card .time-badge {
    position: absolute;
    top: -14px;
    left: 28px;
    background: var(--accent);
    color: #1a1a2e;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: 700;
  }
  .script-card .section-title {
    color: var(--accent);
    font-weight: 700;
    font-size: 1.1em;
    margin: 18px 0 8px;
  }
  .script-card .hot-item {
    display: inline-block;
    background: rgba(232,184,109,0.1);
    border: 1px solid rgba(232,184,109,0.25);
    padding: 2px 10px;
    border-radius: 12px;
    margin: 2px 4px;
    font-size: 0.9em;
  }

  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .error-msg { color: var(--danger); text-align: center; padding: 20px; background: rgba(255,107,107,0.08); border-radius: 10px; }

  .history-section { margin-top: 32px; }
  .history-section h2 { color: var(--accent); font-size: 1.3em; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color .2s;
    cursor: pointer;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-item .h-thumb { width: 140px; height: 78px; border-radius: 10px; background: var(--bg); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 2em; position: relative; overflow: hidden; }
  .h-thumb-play {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); border-radius: 10px;
    color: #fff; font-size: 1.2em;
  }
  .history-item:hover .h-thumb-play, .h-thumb[style*="url"]:not([style*="none"]) .h-thumb-play { display: flex; }
  .h-thumb:not([style*="url"]) .h-thumb-play { display: flex; background: rgba(0,0,0,0.3); }
  .history-item .h-info { flex: 1; min-width: 0; }
  .history-item .h-time { color: var(--sub); font-size: 0.82em; }
  .history-item .h-text { color: var(--text); font-size: 0.9em; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item .h-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .history-item .h-actions button {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-family: inherit; font-size: 0.85em; cursor: pointer; transition: all .2s;
  }
  .history-item .h-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .history-empty { color: var(--sub); text-align: center; padding: 30px; font-size: 0.95em; }

  .video-wrapper { position: relative; }
  .video-close {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 10;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .video-close:hover { background: rgba(255,75,75,0.85); }

  .progress-bar-wrap {
    width: 100%; height: 8px; background: var(--border); border-radius: 4px;
    margin: 12px 0; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), #f0c27a);
    border-radius: 4px; transition: width .3s;
    width: 0%;
  }
  .progress-pct { font-size: 1.1em; font-weight: 700; color: var(--accent); }

  @media (max-width: 700px) {
    header h1 { font-size: 1.5em; }
    header p { font-size: 0.85em; }
    .script-card { padding: 20px 16px; font-size: 0.9em; }
    .controls { flex-direction: column; align-items: stretch; padding: 14px 16px; }
    .controls label { font-size: 0.82em; }
    .controls input[type="date"] { font-size: 0.95em; padding: 8px 12px; }
    .btn { padding: 8px 16px; font-size: 0.9em; }
    body { padding: 10px; }
    .history-item { flex-wrap: wrap; padding: 12px; }
    .history-item .h-thumb { width: 100px; height: 56px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1> 早安电台</h1>
    <p>输入日期，一键生成当天的早安电台文案 + 热点事件</p>
  </header>

  <div class="controls">
    <label for="datePicker"> 日期：</label>
    <input type="date" id="datePicker">
    <button class="btn btn-primary" id="btnGenerate"> 生成早安电台</button>
    <button class="btn btn-outline" id="btnSpeak" disabled> 朗读</button>
    <button class="btn btn-outline" id="btnCopy" disabled> 复制文案</button>
    <button class="btn btn-primary" id="btnGenVideo" disabled> 生成视频</button>
  </div>

  <div id="output"></div>
  <div id="videoStatus"></div>
  <div id="videoPlayer" style="display:none; margin-top:20px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; text-align:center;">
    <div class="video-wrapper">
      <button class="video-close" id="btnVideoClose" title="关闭">✕</button>
      <video id="previewVideo" controls style="width:100%; max-width:100%; border-radius:8px;"></video>
    </div>
  </div>
  <div class="actions" id="actions"></div>

  <div class="history-section">
    <h2> 生成历史</h2>
    <div class="history-list" id="historyList">
      <div class="history-empty">加载中...</div>
    </div>
  </div>
</div>

<script>
// ── 天气 API (Open-Meteo, 免费免 Key) ──────────────────────────
async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia/Shanghai&forecast_days=1`;
  const r = await fetch(url);
  const d = await r.json();
  const day = d.daily;
  const codes = {0:'☀️ 晴',1:' 少云',2:'⛅ 多云',3:'☁️ 阴',45:' 雾',51:' 小雨',61:' 中雨',71:' 小雪',80:' 阵雨',95:'⛈️ 雷暴'};
  const wc = day.weathercode[0];
  return {
    high: day.temperature_2m_max[0],
    low: day.temperature_2m_min[0],
    weather: codes[wc] || wc + '',
    icon: codes[wc] ? codes[wc].split(' ')[0] : ''
  };
}

// ── 热点 API ────────────────────────────────────────────────────
async function fetchWeiboHot() {
  try {
    const r = await fetch('https://tenapi.cn/v2/weibohot');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.code === 200 && d.data) return d.data.slice(0, 15).map(i => i.name);
    throw new Error('Bad response');
  } catch(e) {
    console.warn('Weibo API failed:', e.message);
    return [];
  }
}

async function fetchZhihuHot() {
  try {
    const r = await fetch('https://tenapi.cn/v2/zhihuhot');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.code === 200 && d.data) return d.data.slice(0, 10).map(i => i.name || i.title);
    throw new Error('Bad response');
  } catch(e) {
    console.warn('Zhihu API failed:', e.message);
    return [];
  }
}

// ── 模拟数据 (API 不可用时) ────────────────────────────────────

  const pools = [
    ['科技巨头发布新一代AI芯片', '国际气候峰会达成新协议', '世界杯预选赛亚洲区战报', '央行发布最新经济数据', '新能源汽车销量创新高'],
    ['国产大飞机完成商业首航', '5月电影票房突破50亿', '多地推行数字人民币试点', '高校毕业生就业率公布', '新型储能技术取得突破'],
    ['国际空间站迎来新任务', '量子计算研究新进展', '全球粮食安全报告发布', '文化遗产数字化保护计划', '自动驾驶政策新规出台'],

  const d = new Date(dateStr);

  return pools[i];
}

// ── 生成电台文案（抖音早安电台爆款模板） ──────────────────────
function getWeekdayCN(date) {
  return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][date.getDay()];
}

function formatDateCN(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

// ── 节气查询 ──────────────────────────────────────────────────
function getSolarTerm(dateStr) {
  const d = new Date(dateStr);
  const m = d.getMonth() + 1, day = d.getDate();
  // 24节气大致日期（±1天）
  const terms = [
    {name:'小寒', m:1, d:5}, {name:'大寒', m:1, d:20},
    {name:'立春', m:2, d:4}, {name:'雨水', m:2, d:19},
    {name:'惊蛰', m:3, d:5}, {name:'春分', m:3, d:20},
    {name:'清明', m:4, d:5}, {name:'谷雨', m:4, d:20},
    {name:'立夏', m:5, d:5}, {name:'小满', m:5, d:21},
    {name:'芒种', m:6, d:6}, {name:'夏至', m:6, d:21},
    {name:'小暑', m:7, d:7}, {name:'大暑', m:7, d:22},
    {name:'立秋', m:8, d:7}, {name:'处暑', m:8, d:23},
    {name:'白露', m:9, d:7}, {name:'秋分', m:9, d:23},
    {name:'寒露', m:10,d:8}, {name:'霜降', m:10,d:23},
    {name:'立冬', m:11,d:7}, {name:'小雪', m:11,d:22},
    {name:'大雪', m:12,d:7}, {name:'冬至', m:12,d:22},
  ];
  let best = null;
  for (const t of terms) {
    const td = t.m * 100 + t.d;
    const dd = m * 100 + day;
    if (dd >= td && (!best || td > best.m * 100 + best.d)) best = t;
  }
  if (!best) best = terms[terms.length - 1]; // 小寒之前用冬至
  return best;
}

function getSeasonName(month) {
  if (month >= 3 && month <= 5) return '春天';
  if (month >= 6 && month <= 8) return '夏天';
  if (month >= 9 && month <= 11) return '秋天';
  return '冬天';
}

function pickDailyQuote(dateStr) {
  const d = new Date(dateStr);
  const idx = (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % DAILY_QUOTES.length;
  return DAILY_QUOTES[idx];
}

function pickFromPool(pool, dateStr) {
  const d = new Date(dateStr);
  const seed = (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) % pool.length;
  return pool[seed];
}

function buildScript(dateStr, weather) {
  const d = new Date(dateStr);
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const weekday = getWeekdayCN(d);
  const dateCN = formatDateCN(dateStr);
  const season = getSeasonName(month);
  const term = getSolarTerm(dateStr);

  // 按日期确定性选择模板类别（7大类轮换）
  const catKeys = ['healing', 'growth', 'sober', 'ritual', 'short', 'seasonal', 'quote'];
  const catIdx = (month * 31 + day) % catKeys.length;
  const pool = SCRIPT_POOLS[catKeys[catIdx]];

  // 从选定池中按日期取一句（同一天始终同一句）
  const body = pickFromPool(pool, dateStr);

  // 每日一句名言
  const dailyQuote = pickDailyQuote(dateStr);

  // 天气温馨提示（更自然的融入）
  let weatherNote = '';
  if (weather) {
    const wDesc = weather.weather || '';
    const hi = weather.high, lo = weather.low;
    if (hi > 38) weatherNote = '今天高温炎热，出门务必做好防晒、多喝水，尽量避免正午外出。';
    else if (hi > 33) weatherNote = '今天天气偏热，注意防暑降温，少喝冰饮保护肠胃哦。';
    else if (hi > 28) weatherNote = '今天温暖舒适，很适合出去走走，享受阳光和微风。';
    else if (lo < 0) weatherNote = '今天气温很低，出门记得穿上最厚的外套，别感冒了。';
    else if (lo < 8) weatherNote = '今天有点冷，早晚出门记得添衣保暖，围巾手套都带上吧。';
    else if (lo < 16) weatherNote = '早晚温差较大，记得带一件薄外套，别着凉了。';
    else if (wDesc.includes('雨')) weatherNote = '今天有雨，出门记得带伞。雨天也别忘了保持好心情哦，彩虹总在风雨后。';
    else if (wDesc.includes('雪')) weatherNote = '今天有雪，出门注意防滑保暖。雪花飘落的日子，也是生活赠予的浪漫。';
    else if (wDesc.includes('阴') || wDesc.includes('云')) weatherNote = '今天阴天，但别让天气影响了心情。心里的太阳，自己点亮就好。';
    else if (wDesc.includes('雷')) weatherNote = '今天有雷暴预警，尽量待在室内，安全第一。';
    else if (wDesc.includes('雾')) weatherNote = '今天有雾，出行注意能见度，开车慢一点。迷雾终会散去，阳光就在前方。';
    else if (wDesc.includes('晴')) weatherNote = `今天${season}的天气格外晴朗，阳光正好，微风不燥。`;
  }
  // 如果没有匹配到具体天气描述但有温度数据
  if (!weatherNote && weather && weather.high) {
    weatherNote = `今天${season}的天气刚刚好，最高气温${weather.high}°C。`;
  }

  // 拼接抖音风早安电台文案
  let script = '';
  script += `早安电台  ·  ${dateCN}  ${weekday}\n\n`;
  script += `今天是${month}月${day}日，${weekday}，${term.name}刚过，${season}的气息越来越浓。早安。\n\n`;
  script += body;

  if (weatherNote) {
    script += `\n\n${weatherNote}`;
  }

  script += `\n\n「${dailyQuote.q}」—— ${dailyQuote.a}`;
  script += `\n\n加油！`;

  return script;
}

const output = document.getElementById('output');
const btnGen = document.getElementById('btnGenerate');
const btnSpeak = document.getElementById('btnSpeak');
const btnCopy = document.getElementById('btnCopy');
const datePicker = document.getElementById('datePicker');

// 默认今天
const today = new Date().toISOString().split('T')[0];
datePicker.value = today;

let currentScript = '';
let isSpeaking = false;

btnGen.addEventListener('click', async () => {
  const dateStr = datePicker.value;
  if (!dateStr) return;

  btnGen.disabled = true;
  btnGen.textContent = '⏳ 生成中...';
  output.innerHTML = '<div class="status"><div class="spinner"></div><p>正在获取天气数据...</p></div>';

  const weatherData = await fetchWeather(39.9, 116.4).catch(() => null);

  currentScript = buildScript(dateStr, weatherData);

  output.innerHTML = `<div class="script-card"><div class="time-badge"> ${formatDateCN(dateStr)}</div>${escapeHTML(currentScript).replace(/\n/g, '<br>')}</div>`;
  btnSpeak.disabled = false;
  btnCopy.disabled = false;
  btnGenVideo.disabled = false;
  btnGen.disabled = false;
  btnGen.textContent = ' 重新生成';
});

btnSpeak.addEventListener('click', () => {
  if (!currentScript) return;
  if (isSpeaking) {
    window.speechSynthesis.cancel();
    isSpeaking = false;
    btnSpeak.textContent = ' 朗读';
    return;
  }
  const utterance = new SpeechSynthesisUtterance(currentScript);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.9;
  utterance.pitch = 1.05;
  utterance.onend = () => { isSpeaking = false; btnSpeak.textContent = ' 朗读'; };
  utterance.onerror = () => { isSpeaking = false; btnSpeak.textContent = ' 朗读'; };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
  isSpeaking = true;
  btnSpeak.textContent = '⏹ 停止';
});

btnCopy.addEventListener('click', async () => {
  if (!currentScript) return;
  try {
    await navigator.clipboard.writeText(currentScript);
    btnCopy.textContent = '✓ 已复制';
    setTimeout(() => { btnCopy.textContent = ' 复制文案'; }, 2000);
  } catch {
    btnCopy.textContent = '✗ 失败';
    setTimeout(() => { btnCopy.textContent = ' 复制文案'; }, 2000);
  }
});

    return;
  }

  btnGenVideo.disabled = false;
  btnGenVideo.dataset.generating = 'true';
  btnGenVideo.textContent = '⏹ 取消生成';
  btnGenVideo.style.background = '#ff6b6b';
  btnGenVideo.style.color = '#fff';
  videoStatus.innerHTML = '<div class="status"><div class="spinner"></div><p>正在提交视频生成...</p></div>';
  videoPlayer.style.display = 'none';

  let cancelled = false;
  cancelGeneration = function() {
    cancelled = true;
    fetch('/cancel', { method: 'POST' }).catch(() => {});
  };

  try {
    const r = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: currentScript, name: 'morning_radio' })
    });
    if (!r.ok) {
      const err = await r.json();
      throw new Error(err.error || '请求失败');
    }
    // Poll status
    let done = false;
    while (!done && !cancelled) {
      await new Promise(resolve => setTimeout(resolve, 1500));
      if (cancelled) break;
      const sr = await fetch('/status');
      const st = await sr.json();
      const pct = parseProgress(st.progress);
      const stage = parseStage(st.progress);
      const displayPct = pct >= 0 ? pct : stage.pct;
      if (stage.pct >= 0) {
        videoStatus.innerHTML =
          '<div class="status">' +
            '<div style="font-size:2em;margin-bottom:4px;">' + stage.icon + '</div>' +
            '<div class="progress-pct">' + (displayPct >= 0 ? displayPct + '%' : '...') + '</div>' +
            '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + Math.max(2, displayPct) + '%"></div></div>' +
            '<p style="margin-top:10px;color:var(--accent);font-size:0.95em;">' + escapeHTML(stage.name) + '</p>' +
            '<p style="margin-top:4px;color:var(--sub);font-size:0.72em;font-family:monospace;">' + escapeHTML((st.progress || '').substring(0, 80)) + '</p>' +
          '</div>';
      } else {
        videoStatus.innerHTML =
          '<div class="status">' +
            '<div class="spinner"></div>' +
            '<p style="margin-top:10px;font-size:1em;">' + escapeHTML(stage.name) + '</p>' +
            '<p style="margin-top:4px;color:var(--sub);font-size:0.75em;font-family:monospace;">' + escapeHTML(st.progress || '') + '</p>' +
          '</div>';
      }
      if (!st.running) {
        done = true;
        if (st.output) {
          videoStatus.innerHTML = '';
          previewVideo.src = '/video?t=' + Date.now();
          videoPlayer.style.display = 'block';
          previewVideo.play();
          loadHistory();
        } else if (st.error) {
          videoStatus.innerHTML = '<div class="error-msg">' + escapeHTML(st.error) + '</div>';
        }
      }
    }
    if (cancelled) {
      videoStatus.innerHTML = '<div class="status"><p style="color:var(--sub);"> 已取消生成</p></div>';
    }
  } catch(e) {
    if (!cancelled) {
      videoStatus.innerHTML = '<div class="error-msg"><p>' + escapeHTML(e.message) + '</p><button class="btn btn-outline" style="margin-top:10px;" onclick="btnGenVideo.click()"> 重试</button></div>';
    }
  }
  // Reset button state
  btnGenVideo.dataset.generating = '';
  btnGenVideo.textContent = ' 生成视频';
  btnGenVideo.style.background = '';
  btnGenVideo.style.color = '';
  btnGenVideo.disabled = false;
  cancelGeneration = null;
});

function cancelGen() {
  if (cancelGeneration) cancelGeneration();
}

// ── 历史记录 ───────────────────────────────────────────────────────
const historyList = document.getElementById('historyList');

async function loadHistory() {
  try {
    const r = await fetch('/history');
    const items = await r.json();
    if (!items.length) {
      historyList.innerHTML = '<div class="history-empty">暂无生成记录，快去生成第一个视频吧！</div>';
      return;
    }
    historyList.innerHTML = items.map((h, i) => `
      <div class="history-item" data-name="${escapeHTML(h.name)}">
        <div class="h-thumb" style="background-image:url('/thumbnail?name=${encodeURIComponent(h.name)}'); background-size:cover; background-position:center;">
          <div class="h-thumb-play">▶</div>
        </div>
        <div class="h-info">
          <div class="h-time">${escapeHTML(h.time)}  ·  耗时 ${h.duration}s</div>
          <div class="h-text">${escapeHTML(h.text)}</div>
        </div>
        <div class="h-actions">
          <button class="h-play" data-name="${escapeHTML(h.name)}">▶ 播放</button>
          <button class="h-dl" data-name="${escapeHTML(h.name)}">↓ 下载</button>
        </div>
      </div>
    `).join('');

    // Play button handler
    historyList.querySelectorAll('.h-play').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = btn.dataset.name;
        previewVideo.src = '/video?name=' + encodeURIComponent(name + '.mp4');
        videoPlayer.style.display = 'block';
        previewVideo.play();
        videoPlayer.scrollIntoView({ behavior: 'smooth' });
      });
    });

    // Download button handler
    historyList.querySelectorAll('.h-dl').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = btn.dataset.name;
        const a = document.createElement('a');
        a.href = '/video?name=' + encodeURIComponent(name + '.mp4');
        a.download = name + '.mp4';
        a.click();
      });
    });

    // Click on entire item to play
    historyList.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => {
        const name = item.dataset.name;
        previewVideo.src = '/video?name=' + encodeURIComponent(name + '.mp4');
        videoPlayer.style.display = 'block';
        previewVideo.play();
        videoPlayer.scrollIntoView({ behavior: 'smooth' });
      });
    });
  } catch(e) {
    historyList.innerHTML = '<div class="history-empty">加载失败: ' + escapeHTML(e.message) + '</div>';
  }
}

function parseProgress(raw) {
  // Parse tqdm-style progress like "t:  22%|..." or "  47%|..."
  if (!raw) return -1;
  const m = raw.match(/(\d+)%/);
  return m ? parseInt(m[1]) : -1;
}

function parseStage(raw) {
  if (!raw) return {name:'准备中...', icon:'🔄', pct:0};
  if (raw.includes('TTS') || raw.includes('语音')) return {name:'合成语音中...', icon:'🎙️', pct:5};
  if (raw.includes('素材') || raw.includes('照片') || raw.includes('Pexels')) return {name:'准备视频素材...', icon:'🎬', pct:15};
  if (raw.includes('滤镜') || raw.includes('合成')) return {name:'合成画面与滤镜...', icon:'🎨', pct:50};
  if (raw.includes('导出')) return {name:'导出视频文件...', icon:'📦', pct:85};
  if (raw.startsWith('t:') || raw.includes('%')) {
    const m = raw.match(/(\d+)%/);
    return {name:'渲染视频帧...', icon:'⏳', pct: m ? parseInt(m[1]) : 50};
  }
  if (raw.includes('完成')) return {name:'完成！', icon:'✅', pct:100};
  if (raw.includes('取消')) return {name:'已取消', icon:'⏹', pct:0};
  if (raw.includes('开始')) return {name:'开始生成...', icon:'🚀', pct:2};
  return {name:raw.substring(0, 40), icon:'🔄', pct:-1};
}

function escapeHTML(str) {
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  return str.replace(/[&<>"']/g, c => map[c]);
}

// ── 键盘快捷键 ──────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (btnGenVideo.dataset.generating === 'true') cancelGen();
    else if (currentScript && !btnGenVideo.disabled) btnGenVideo.click();
    else btnGen.click();
  }
});

// 页面加载时自动生成 & 加载历史
btnGen.click();
loadHistory();
</script>
