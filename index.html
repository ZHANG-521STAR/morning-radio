<head>
<meta charset="UTF-8">

<title>早安电台生成器</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e8b86d;
    --text: #eaeaea;
    --sub: #a0a0b0;
    --border: #2a2a4a;
    --danger: #ff6b6b;
    --green: #51cf66;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width:900px; width:100%; }
  header {
    text-align: center;
    padding: 30px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header h1 { font-size: 2.2em; color: var(--accent); letter-spacing: 2px; }
  header p { color: var(--sub); margin-top: 6px; font-size: 0.95em; }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
    background: var(--card);
    padding: 18px 22px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .controls label { font-weight: 600; color: var(--sub); font-size: 0.9em; white-space: nowrap; }
  .controls input[type="date"] {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 1em;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .controls input[type="date"]:focus { border-color: var(--accent); }
  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #1a1a2e; }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .btn-outline:hover { background: var(--accent); color: #1a1a2e; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .status {
    text-align: center;
    padding: 40px;
    color: var(--sub);
  }
  .status .spinner {
    display: inline-block;
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .script-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 36px;
    line-height: 1.9;
    font-size: 1.05em;
    white-space: pre-wrap;
    position: relative;
  }
  .script-card .time-badge {
    position: absolute;
    top: -14px;
    left: 28px;
    background: var(--accent);
    color: #1a1a2e;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: 700;
  }
  .script-card .section-title {
    color: var(--accent);
    font-weight: 700;
    font-size: 1.1em;
    margin: 18px 0 8px;
  }
  .script-card .hot-item {
    display: inline-block;
    background: rgba(232,184,109,0.1);
    border: 1px solid rgba(232,184,109,0.25);
    padding: 2px 10px;
    border-radius: 12px;
    margin: 2px 4px;
    font-size: 0.9em;
  }

  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .error-msg { color: var(--danger); text-align: center; padding: 20px; background: rgba(255,107,107,0.08); border-radius: 10px; }

  .history-section { margin-top: 32px; }
  .history-section h2 { color: var(--accent); font-size: 1.3em; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-item {
    background: var(--card);

    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;

    cursor: pointer;

  .history-item .h-time { color: var(--sub); font-size: 0.82em; }

  .history-item .h-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .history-item .h-actions button {

  .history-empty { color: var(--sub); text-align: center; padding: 30px; font-size: 0.95em; }

    top: 10px; right: 10px;

// ── 天气 API (Open-Meteo, 免费免 Key) ──────────────────────────
async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia/Shanghai&forecast_days=1`;
  const r = await fetch(url);
  const d = await r.json();
  const day = d.daily;
  const codes = {0:'☀️ 晴',1:' 少云',2:'⛅ 多云',3:'☁️ 阴',45:' 雾',51:' 小雨',61:' 中雨',71:' 小雪',80:' 阵雨',95:'⛈️ 雷暴'};
  const wc = day.weathercode[0];
  return {
    high: day.temperature_2m_max[0],
    low: day.temperature_2m_min[0],
    weather: codes[wc] || wc + '',
    icon: codes[wc] ? codes[wc].split(' ')[0] : ''
  };
}

// ── 热点 API ────────────────────────────────────────────────────
async function fetchWeiboHot() {
  try {
    const r = await fetch('https://tenapi.cn/v2/weibohot');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.code === 200 && d.data) return d.data.slice(0, 15).map(i => i.name);
    throw new Error('Bad response');
  } catch(e) {
    console.warn('Weibo API failed:', e.message);
    return [];
  }
}

async function fetchZhihuHot() {
  try {
    const r = await fetch('https://tenapi.cn/v2/zhihuhot');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.code === 200 && d.data) return d.data.slice(0, 10).map(i => i.name || i.title);
    throw new Error('Bad response');
  } catch(e) {
    console.warn('Zhihu API failed:', e.message);
    return [];
  }
}

  const d = new Date(dateStr);
  const i = (d.getDate() + d.getMonth() * 7) % pools.length;

}

// ── 生成电台文案（抖音早安电台爆款模板） ──────────────────────
function getWeekdayCN(date) {
  return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][date.getDay()];
}

function formatDateCN(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

  ],
};

function pickFromPool(pool, dateStr) {
  const d = new Date(dateStr);
  const seed = (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) % pool.length;
  return pool[seed];
}

function buildScript(dateStr, weather, hotEvents) {
  const d = new Date(dateStr);
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const weekday = getWeekdayCN(d);
  const dateCN = formatDateCN(dateStr);

  // 按日期确定性选择模板类别（每天固定类别，但每天不同）
  const catKeys = ['healing', 'growth', 'sober', 'ritual', 'short'];
  const catIdx = (month * 31 + day) % catKeys.length;
  const pool = SCRIPT_POOLS[catKeys[catIdx]];

  // 从选定池中按日期取一句（同一天始终同一句）
  const body = pickFromPool(pool, dateStr);

  // 天气温馨提示（自然融入）
  let weatherNote = '';
  if (weather) {
    if (weather.high > 35) weatherNote = '今天天气炎热，出门记得多喝水、做好防晒。';
    else if (weather.high > 30) weatherNote = '今天有点热，注意防暑降温哦。';
    else if (weather.low < 5) weatherNote = '今天天气寒冷，出门记得添衣保暖。';
    else if (weather.low < 15) weatherNote = '早晚温差较大，记得带一件外套。';
    else if (weather.weather && weather.weather.includes('雨')) weatherNote = '今天有雨，出门记得带伞。';
  }

  // 拼接抖音风早安电台文案
  let script = '';
  script += `早安电台  ·  ${dateCN}  ${weekday}\n\n`;

  script += `今天是${month}月${day}日，${weekday}，早安。\n\n`;
  script += body;

  if (weatherNote) {
    script += `\n\n${weatherNote}`;
  }

  script += `\n\n加油！`;

  return script;
}

// ── 主流程 ────────────────────────────────────────────────────────
const output = document.getElementById('output');
const btnGen = document.getElementById('btnGenerate');
const btnSpeak = document.getElementById('btnSpeak');
const btnCopy = document.getElementById('btnCopy');
const datePicker = document.getElementById('datePicker');

// 默认今天
const today = new Date().toISOString().split('T')[0];
datePicker.value = today;

let currentScript = '';
let isSpeaking = false;

btnGen.addEventListener('click', async () => {
  const dateStr = datePicker.value;
  if (!dateStr) return;

  btnGen.disabled = true;
  btnGen.textContent = '⏳ 生成中...';
  output.innerHTML = '<div class="status"><div class="spinner"></div><p>正在获取天气数据...</p></div>';

  const weatherData = await fetchWeather(39.9, 116.4).catch(() => null);

  currentScript = buildScript(dateStr, weatherData, null);

  output.innerHTML = `<div class="script-card"><div class="time-badge"> ${formatDateCN(dateStr)}</div>${escapeHTML(currentScript).replace(/\n/g, '<br>')}</div>`;
  btnSpeak.disabled = false;
  btnCopy.disabled = false;
  btnGenVideo.disabled = false;
  btnGen.disabled = false;
  btnGen.textContent = ' 重新生成';
});

btnSpeak.addEventListener('click', () => {
  if (!currentScript) return;
  if (isSpeaking) {
    window.speechSynthesis.cancel();
    isSpeaking = false;
    btnSpeak.textContent = ' 朗读';
    return;
  }
  const utterance = new SpeechSynthesisUtterance(currentScript);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.9;
  utterance.pitch = 1.05;
  utterance.onend = () => { isSpeaking = false; btnSpeak.textContent = ' 朗读'; };
  utterance.onerror = () => { isSpeaking = false; btnSpeak.textContent = ' 朗读'; };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
  isSpeaking = true;
  btnSpeak.textContent = '⏹ 停止';
});

btnCopy.addEventListener('click', async () => {
  if (!currentScript) return;
  try {
    await navigator.clipboard.writeText(currentScript);
    btnCopy.textContent = '✓ 已复制';
    setTimeout(() => { btnCopy.textContent = ' 复制文案'; }, 2000);
  } catch {
    btnCopy.textContent = '✗ 失败';
    setTimeout(() => { btnCopy.textContent = ' 复制文案'; }, 2000);
  }
});

// ── 视频生成 ───────────────────────────────────────────────────────
const btnGenVideo = document.getElementById('btnGenVideo');
const videoStatus = document.getElementById('videoStatus');
const videoPlayer = document.getElementById('videoPlayer');
const previewVideo = document.getElementById('previewVideo');
const btnVideoClose = document.getElementById('btnVideoClose');

btnVideoClose.addEventListener('click', () => {
  previewVideo.pause();
  previewVideo.src = '';
  videoPlayer.style.display = 'none';
});

let cancelGeneration = null;

btnGenVideo.addEventListener('click', async () => {
  if (!currentScript) return;

  // If already generating, the button acts as cancel
  if (btnGenVideo.dataset.generating === 'true') {
    cancelGen();
    return;
  }

  btnGenVideo.disabled = false;
  btnGenVideo.dataset.generating = 'true';
  btnGenVideo.textContent = '⏹ 取消生成';
  btnGenVideo.style.background = '#ff6b6b';
  btnGenVideo.style.color = '#fff';
  videoStatus.innerHTML = '<div class="status"><div class="spinner"></div><p>正在提交视频生成...</p></div>';
  videoPlayer.style.display = 'none';

  let cancelled = false;
  cancelGeneration = function() {
    cancelled = true;
    fetch('/cancel', { method: 'POST' }).catch(() => {});
  };

  try {
    const r = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: currentScript, name: 'morning_radio' })
    });
    if (!r.ok) {
      const err = await r.json();
      throw new Error(err.error || '请求失败');
    }
    // Poll status
    let done = false;
    while (!done && !cancelled) {
      await new Promise(resolve => setTimeout(resolve, 1500));
      if (cancelled) break;
      const sr = await fetch('/status');
      const st = await sr.json();
      const pct = parseProgress(st.progress);
      const stageText = parseStage(st.progress);
      if (pct >= 0) {
        videoStatus.innerHTML =
          '<div class="status">' +
            '<div class="progress-pct">' + pct + '%</div>' +
            '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
            '<p style="margin-top:10px;color:var(--accent);font-size:0.9em;"> 正在渲染视频...</p>' +
            '<p style="margin-top:4px;color:var(--sub);font-size:0.75em;font-family:monospace;">' + escapeHTML(st.progress.substring(0, 80)) + '</p>' +
          '</div>';
      } else {
        videoStatus.innerHTML =
          '<div class="status">' +
            '<div class="spinner"></div>' +
            '<p style="margin-top:10px;font-size:1em;">' + escapeHTML(stageText) + '</p>' +
            '<p style="margin-top:4px;color:var(--sub);font-size:0.75em;font-family:monospace;">' + escapeHTML(st.progress || '') + '</p>' +
          '</div>';
      }
      if (!st.running) {
        done = true;
        if (st.output) {
          videoStatus.innerHTML = '';
          previewVideo.src = '/video?t=' + Date.now();
          videoPlayer.style.display = 'block';
          previewVideo.play();
          loadHistory();
        } else if (st.error) {
          videoStatus.innerHTML = '<div class="error-msg">' + escapeHTML(st.error) + '</div>';
        }
      }
    }
    if (cancelled) {
      videoStatus.innerHTML = '<div class="status"><p style="color:var(--sub);"> 已取消生成</p></div>';
    }
  } catch(e) {
    if (!cancelled) {
      videoStatus.innerHTML = '<div class="error-msg">' + escapeHTML(e.message) + '</div>';
    }
  }
  // Reset button state
  btnGenVideo.dataset.generating = '';
  btnGenVideo.textContent = ' 生成视频';
  btnGenVideo.style.background = '';
  btnGenVideo.style.color = '';
  btnGenVideo.disabled = false;
  cancelGeneration = null;
});

function cancelGen() {
  if (cancelGeneration) cancelGeneration();
}

// ── 历史记录 ───────────────────────────────────────────────────────
const historyList = document.getElementById('historyList');

async function loadHistory() {
  try {
    const r = await fetch('/history');
    const items = await r.json();
    if (!items.length) {
      historyList.innerHTML = '<div class="history-empty">暂无生成记录，快去生成第一个视频吧！</div>';
      return;
    }
    historyList.innerHTML = items.map((h, i) => `
      <div class="history-item" data-name="${escapeHTML(h.name)}">
        <div class="h-thumb">▶</div>
        <div class="h-info">
          <div class="h-time">${escapeHTML(h.time)}  ·  耗时 ${h.duration}s</div>
          <div class="h-text">${escapeHTML(h.text)}</div>
        </div>
        <div class="h-actions">
          <button class="h-play" data-name="${escapeHTML(h.name)}">▶ 播放</button>
          <button class="h-dl" data-name="${escapeHTML(h.name)}"> 下载</button>
        </div>
      </div>
    `).join('');

    // Play button handler
    historyList.querySelectorAll('.h-play').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = btn.dataset.name;
        previewVideo.src = '/video?name=' + encodeURIComponent(name + '.mp4');
        videoPlayer.style.display = 'block';
        previewVideo.play();
        videoPlayer.scrollIntoView({ behavior: 'smooth' });
      });
    });

    // Download button handler
    historyList.querySelectorAll('.h-dl').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = btn.dataset.name;
        const a = document.createElement('a');
        a.href = '/video?name=' + encodeURIComponent(name + '.mp4');
        a.download = name + '.mp4';
        a.click();
      });
    });

    // Click on entire item to play
    historyList.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => {
        const name = item.dataset.name;
        previewVideo.src = '/video?name=' + encodeURIComponent(name + '.mp4');
        videoPlayer.style.display = 'block';
        previewVideo.play();
        videoPlayer.scrollIntoView({ behavior: 'smooth' });
      });
    });
  } catch(e) {
    historyList.innerHTML = '<div class="history-empty">加载失败: ' + escapeHTML(e.message) + '</div>';
  }
}

function parseProgress(raw) {
  // Parse tqdm-style progress like "t:  22%|..." or "  47%|..."
  if (!raw) return -1;
  const m = raw.match(/(\d+)%/);
  return m ? parseInt(m[1]) : -1;
}

function parseStage(raw) {
  if (!raw) return '准备中...';
  if (raw.includes('TTS') || raw.includes('语音')) return '正在合成语音...';
  if (raw.includes('素材') || raw.includes('Pexels')) return '正在获取视频素材...';
  if (raw.includes('滤镜') || raw.includes('合成')) return '正在合成视频画面...';
  if (raw.includes('导出')) return '正在导出视频文件...';
  if (raw.startsWith('t:') || raw.includes('%')) return '正在渲染视频...';
  if (raw.includes('开始')) return '开始生成...';
  if (raw.includes('完成')) return '完成！';
  return raw.substring(0, 40);
}

function escapeHTML(str) {
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  return str.replace(/[&<>"']/g, c => map[c]);
}

// 页面加载时自动生成 & 加载历史
btnGen.click();
loadHistory();
</script>
